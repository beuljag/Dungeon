# 던전 전용 공허 월드. 서버를 켤 때마다 이 월드 폴더를 지우고 새로 만든다. 기존 월드 이름을 쓰면 안 된다.
world-name: dungeon_instances
# 접속이 끊긴 뒤 이 시간 안에 돌아오지 않으면 사망 처리한다.
reconnect-seconds: 300
# 맵이 준비된 뒤 입장까지 기다리는 시간. 파티원이 이 사이에 파티를 나가면 입장하지 않는다.
entry-delay-seconds: 5
# 다음 층 발판을 밟은 뒤 내려갈 때까지 기다리는 시간. 이 사이에 출구로 나갈 수 있다.
descend-delay-seconds: 10
max-party-size: 4
# false면 플레이어가 직접 /던전 입장을 쓸 수 없고, NPC나 콘솔이 대상을 지정해 실행해야 한다.
allow-player-enter-command: true
# 연결되지 않은 문을 막는 블록
door-seal-block: STONE_BRICKS
# 보스를 잡으면 발판 아래에 깔리는 블록
next-gate-block: CRYING_OBSIDIAN
exit-gate-block: GOLD_BLOCK
# 던전 안에서 쓸 수 있는 명령어 (dungeon.admin 권한은 제한 없음)
allowed-commands:
  - dungeon
  - 던전
  - msg
  - tell
  - w
  - r

party-scaling:
  # 살아 있는 파티원이 1명 늘 때마다 [몹] 표지판 하나에서 나오는 몹 수에 더해지는 비율(%).
  # 일반 몹과 웨이브 몹에 적용되고, 혼자면 적용되지 않는다. 0이면 인원과 관계없이 같다.
  mob-count-percent: 50

# 던전 재화. 던전 안에서만 쓰고, 나가면 사라진다. 살아 있는 파티원이 각자 같은 양을 받는다.
currency-name: 던전 코인
coins:
  mob: 5
  boss: 50
  treasure: 30
  mimic: 60
  wave-clear: 40
  # 층이 하나 깊어질 때마다 늘어나는 비율(%). 50이면 2층은 1.5배, 3층은 2배다.
  floor-bonus-percent: 50

# [보물] 상자. 처음 열 때 이 확률로 미믹이 나온다.
treasure:
  mimic-chance: 25
  mimic-mob: ZOMBIE

# [제단] 플레이어마다 제단 하나당 한 번씩 쓸 수 있다. 효과 형식: 효과이름 레벨 초
# 같은 줄을 여러 번 적으면 그만큼 자주 나온다.
altar:
  block: ENCHANTING_TABLE
  curse-chance: 20
  blessings:
    - REGENERATION 2 20
    - STRENGTH 1 60
    - SPEED 1 60
    - RESISTANCE 1 60
    - INSTANT_HEALTH 2 1
  curses:
    - WEAKNESS 1 30
    - SLOWNESS 1 30
    - HUNGER 1 30

# [도박] 누르면 bet만큼 걸고, win-chance 확률로 두 배를 돌려받는다.
gamble:
  block: LODESTONE
  bet: 20
  win-chance: 45
  # 플레이어마다 제단 하나당 쓸 수 있는 횟수
  max-uses: 3

# [웨이브] 방에 들어오면 문이 닫히고, 몹을 모두 잡으면 다음 웨이브가 나온다.
wave:
  count: 3
  door-block: IRON_BARS

# 상점 방 하나가 층의 상품 목록에서 랜덤으로 골라 파는 수 (최대 27)
shop:
  slots: 9
